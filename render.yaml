# Render.com deployment configuration for TOMAS Chatbot with Vector Search
services:
  - type: web
    name: tomas-chatbot
    env: python
    plan: free  # Back to free tier
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
      python -c "import nltk; nltk.download('punkt'); nltk.download('stopwords'); nltk.download('averaged_perceptron_tagger')"
    startCommand: |
      python start.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: LOG_LEVEL
        value: INFO
      - key: HF_HUB_DISABLE_SYMLINKS_WARNING
        value: "1"
      - key: TRANSFORMERS_CACHE
        value: /opt/render/project/src/.cache
      - key: HF_HOME
        value: /opt/render/project/src/.cache/huggingface
      - key: PGVECTOR_ENABLED
        value: "true"

# Database configuration removed for free tier
# Use external Supabase database