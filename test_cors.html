<!DOCTYPE html>
<html>
<head>
    <title>CORS Test for Tomas Chatbot</title>
</head>
<body>
    <h1>CORS Test</h1>
    <button onclick="testCORS()">Test CORS Connection</button>
    <div id="result"></div>

    <script>
    async function testCORS() {
        const resultDiv = document.getElementById('result');
        resultDiv.innerHTML = 'Testing CORS...';
        
        try {
            const response = await fetch('https://tomaschatbot.onrender.com/health', {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json'
                }
            });
            
            if (response.ok) {
                const data = await response.json();
                resultDiv.innerHTML = `✅ CORS Working! Response: ${JSON.stringify(data, null, 2)}`;
            } else {
                resultDiv.innerHTML = `❌ HTTP Error: ${response.status} ${response.statusText}`;
            }
        } catch (error) {
            resultDiv.innerHTML = `❌ CORS Error: ${error.message}`;
        }
    }
    </script>
</body>
</html>
